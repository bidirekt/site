name: Bug report
description: Report something that does not work as expected.
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page
      description: The URL of the page.
    validations:
      required: true
